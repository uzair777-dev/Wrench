name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  QT_QPA_PLATFORM: offscreen
  GIT_AUTHOR_NAME: CI Runner
  GIT_AUTHOR_EMAIL: ci@wrench.local
  GIT_COMMITTER_NAME: CI Runner
  GIT_COMMITTER_EMAIL: ci@wrench.local
  GIT_TERMINAL_PROMPT: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .
      - name: Platform-abstraction guard (FR-11.1-11.3)
        run: |
          if grep -rn "secretstorage\|SSH_AUTH_SOCK\|XDG_" src/wrench --include="*.py" \
             | grep -v -E "credentials/(backend|secret_service|__init__)\.py|core/(paths|ssh_agent)\.py"; then
            echo "::error::Found a platform-specific reference outside the abstraction layer"
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/setup-test-env
      - run: pytest tests/unit tests/core -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/setup-test-env
      - run: pytest tests/integration -v

  ui-tests:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/setup-test-env
      - run: pytest tests/ui -v
